<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti preciosa</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      overflow: hidden;
    }

    /* --- Estrellas fugaces --- */
    .shooting-stars {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .shooting-star {
      position: absolute;
      width: 150px;
      height: 2px;
      background: linear-gradient(-45deg, #fff, rgba(255, 255, 255, 0));
      border-radius: 999px;
      filter: drop-shadow(0 0 6px #fff);
      left: -150px;
      animation: shooting 3s ease-in-out forwards;
    }
    @keyframes shooting {
      0% { transform: translateX(0) translateY(0); opacity: 1; }
      100% { transform: translateX(100vw) translateY(100vh); opacity: 0; }
    }

    /* --- Frases animadas --- */
    .frase-container {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3vmin;
      font-family: "Segoe UI", sans-serif;
      color: #fff;
      text-align: center;
      z-index: 10;
      width: 90%;
      max-width: 600px;
      overflow: hidden;
    }
    .frase {
      position: absolute;
      opacity: 0;
      width: 100%;
      animation: cambiarFrase 16s infinite;
      text-shadow: 0 0 10px #00eaff, 0 0 20px #ffcc00;
    }
    .frase:nth-child(1) { animation-delay: 0s; }
    .frase:nth-child(2) { animation-delay: 4s; }
    .frase:nth-child(3) { animation-delay: 8s; }
    .frase:nth-child(4) { animation-delay: 12s; }
    @keyframes cambiarFrase {
      0% { opacity: 0; transform: translateY(20px); }
      10% { opacity: 1; transform: translateY(0); }
      25% { opacity: 1; transform: translateY(0); }
      35% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 0; }
    }

    /* --- Flores y césped (resumen de tu parte) --- */
    .flowers {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 5;
    }
    .growing-grass {
      position: relative;
      margin: 0 5px;
    }
    .flower__grass {
      position: relative;
      width: 20px;
      height: 80px;
      background: linear-gradient(to top, #228b22, #32cd32);
      border-radius: 5px;
    }
    .flower__grass__leaf {
      position: absolute;
      width: 15px;
      height: 25px;
      background: #32cd32;
      border-radius: 50% 50% 0 0;
    }
    .flower__grass__leaf--1 { top: 10px; left: -10px; transform: rotate(-30deg); }
    .flower__grass__leaf--2 { top: 20px; left: 15px; transform: rotate(30deg); }
    .flower__grass__leaf--3 { top: 35px; left: -10px; transform: rotate(-40deg); }
    .flower__grass__leaf--4 { top: 50px; left: 15px; transform: rotate(40deg); }
    .flower__grass__leaf--5 { top: 65px; left: -10px; transform: rotate(-25deg); }
    .flower__grass__leaf--6 { top: 75px; left: 15px; transform: rotate(25deg); }
    .flower__grass__overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
    }
  </style>
</head>
<body class="not-loaded">

  <!-- Estrellas fugaces -->
  <div class="shooting-stars"></div>

  <!-- Frases animadas -->
  <div class="frase-container">
    <div class="frase">✨ PARA TI PRECIOSA ✨</div>
    <div class="frase">🌻 ERES MI GIRASOL 🌻</div>
    <div class="frase">💫 MI ESTRELLA FAVORITA 💫</div>
    <div class="frase">💖 TE QUIERO MUCHO 💖</div>
  </div>

  <!-- Flores y césped -->
  <div class="flowers">
    <div class="growing-grass">
      <div class="flower__grass flower__grass--6">
        <div class="flower__grass__leaf flower__grass__leaf--1"></div>
        <div class="flower__grass__leaf flower__grass__leaf--2"></div>
        <div class="flower__grass__leaf flower__grass__leaf--3"></div>
        <div class="flower__grass__leaf flower__grass__leaf--4"></div>
        <div class="flower__grass__leaf flower__grass__leaf--5"></div>
        <div class="flower__grass__leaf flower__grass__leaf--6"></div>
        <div class="flower__grass__overlay"></div>
      </div>
    </div>

    <div class="growing-grass">
      <div class="flower__grass flower__grass--7">
        <div class="flower__grass__leaf flower__grass__leaf--1"></div>
        <div class="flower__grass__leaf flower__grass__leaf--2"></div>
        <div class="flower__grass__leaf flower__grass__leaf--3"></div>
        <div class="flower__grass__leaf flower__grass__leaf--4"></div>
        <div class="flower__grass__overlay"></div>
      </div>
    </div>

    <div class="growing-grass">
      <div class="flower__grass flower__grass--8">
        <div class="flower__grass__leaf flower__grass__leaf--1"></div>
        <div class="flower__grass__leaf flower__grass__leaf--2"></div>
        <div class="flower__grass__leaf flower__grass__leaf--3"></div>
        <div class="flower__grass__leaf flower__grass__leaf--4"></div>
        <div class="flower__grass__leaf flower__grass__leaf--5"></div>
        <div class="flower__grass__overlay"></div>
      </div>
    </div>

    <div class="growing-grass">
      <div class="flower__grass flower__grass--9">
        <div class="flower__grass__leaf flower__grass__leaf--1"></div>
        <div class="flower__grass__leaf flower__grass__leaf--2"></div>
        <div class="flower__grass__leaf flower__grass__leaf--3"></div>
        <div class="flower__grass__overlay"></div>
      </div>
    </div>

    <div class="growing-grass">
      <div class="flower__grass flower__grass--10">
        <div class="flower__grass__leaf flower__grass__leaf--1"></div>
        <div class="flower__grass__leaf flower__grass__leaf--2"></div>
        <div class="flower__grass__leaf flower__grass__leaf--3"></div>
        <div class="flower__grass__overlay"></div>
      </div>
    </div>
  </div>

  <!-- Script estrellas fugaces -->
  <script>
    onload = () => {
      const c = setTimeout(() => {
        document.body.classList.remove("not-loaded");
        
        function createShootingStar() {
          const star = document.createElement('div');
          star.className = 'shooting-star';
          star.style.top = Math.random() * 60 + '%';
          star.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
          document.querySelector('.shooting-stars').appendChild(star);
          setTimeout(() => { star.remove(); }, 4000);
        }
        
        setInterval(() => {
          if (Math.random() > 0.3) { 
            createShootingStar();
          }
        }, Math.random() * 5000 + 3000);
        clearTimeout(c);
      }, 1000);
    };
  </script>
</body>
</html>
